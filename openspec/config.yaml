schema: spec-driven

# 모든 변경(proposal · specs · design · tasks)을 만들 때 AI가 먼저 읽는 프로젝트 요약
context: |
  Language: Korean
  All artifacts must be written in Korean.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  프로젝트: 우르르(ururu) — 가까운 친구와 가볍게 모이는 위치 기반 채팅 앱 (참고: Yubo, Snapchat, Instagram)
  대상: PC 브라우저 · Android · iOS 세 곳에서 같은 화면, 같은 동작
  읽는 사람: 초보 개발자. 전문 용어를 줄이고 쉬운 한국어(해요체)로 짧게 쓴다.

  꼭 읽을 문서:
  - CLAUDE.md                          작업 규칙 1~7 + 8번 "미미가 정한 것"(바꾸지 말 것)
  - docs/explanation/progress.md       지금 상태 · 남은 과제(진행 0번) · 작업 기록
  - docs/reference/coding-rules.md     코드 작성 지침 (KISS, YAGNI, DRY, SOLID, Result 패턴, Airbnb + Prettier)
  - docs/reference/file-tree.md        프로젝트 전체 파일 트리 (문서·OpenSpec·코드)
  - docs/README.md                     문서를 어디에 쓰는지 (Diátaxis 4분류)
  - docs/explanation/architecture.md   계층 · SOLID · 디자인 패턴이 어느 파일에 있는지

  지금 상태: React 19 버전. .env가 있으면 진짜 서버(Firebase RealServer), 없으면 FakeServer 시연 모드. 홈 지도는 카카오 지도.
  출시: 구글 플레이. 폰 앱(Capacitor)은 아직 (add-mobile-apps).
  작업 지침: CLAUDE.md (파일을 새로 만들지 말고 원래 파일을 고친다)
  폴더: src/core(공통) → src/data(저장·규칙·서버) → src/ui(화면). 반대 방향 import 금지.

rules:
  proposal:
    - "사용자가 보는 화면이나 동작이 바뀌는지 먼저 밝힌다. 안 바뀌면 skip_specs: true"
    - "하지 않는 것(Non-goals)을 적는다"
  specs:
    - "시나리오 이름 앞에 기능 번호를 붙인다 (SHELL-, ACC-, PRO-, MAP-, CHAT-, STO-, SWP-, FRD-, PNG-)"
    - "화면에 보이는 문구는 실제 문구 그대로 큰따옴표로 적는다"
  design:
    - "결정마다 이유와 버린 대안을 적는다"
    - "새 라이브러리는 package.json에 버전을 고정하고, 고른 이유를 design.md에 적는다"
  tasks:
    - "칸마다 확인 방법(시나리오 번호, 시험, 사진 비교)을 적는다"
    - "파일을 더하거나 지우면 docs/reference/file-tree.md도 같이 고친다"
    - "끝나면 docs/explanation/progress.md 진행 0번(완료 · 남은 과제)도 같이 고친다"

operations:
  apply:
    guidance:
      - "docs/reference/coding-rules.md 6번 체크리스트를 지킨다"
      - "같은 일을 하는 파일·폴더를 새로 만들지 않고 원래 파일을 고친다 (CLAUDE.md 1번). 결과물 자리를 바꿀 땐 먼저 묻는다"
      - "화면에 설명·안내 문구를 덧붙이지 않는다. 화면 글자는 미미가 정한 것만, 필요하면 먼저 묻는다 (CLAUDE.md 3번)"
      - "원본과 화면이 같아야 하는 작업은 npm run compare로 확인한다"
