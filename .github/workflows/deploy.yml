# =========================================================
# GitHub → Cloudflare Pages 자동 배포
# ---------------------------------------------------------
# master에 push하면:
#   1. GitHub 시크릿 ENV_FILE(.env 내용 통째로)을 .env 파일로 만들어서 빌드
#   2. 사용자 앱  → Cloudflare Pages "app-ururu"   (app-ururu.pages.dev)
#   3. 운영자 사이트 → Cloudflare Pages "ururu-admin" (ururu-admin.pages.dev)
# 키는 git에 올라가지 않고 GitHub 시크릿에만 있어요.
# Cloudflare 쪽 "자동 배포"는 꺼야 해요 (안 끄면 키 없이 빌드해서 덮어씀).
# =========================================================
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # GitHub → Actions 탭에서 손으로 다시 실행할 수 있게

env:
  CLOUDFLARE_ACCOUNT_ID: f77b903e13d7f3b5a68b9c16fd552237 # 계정 번호 (비밀번호 아님)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub 시크릿 ENV_FILE(내 컴퓨터 .env 내용 그대로)을 .env 파일로 만들어요 (git에는 안 올라감)
      - name: .env 만들기
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      # 키가 빠졌으면 가짜 서버로 올라가니까, 여기서 멈춰요 (값은 로그에 안 찍혀요)
      - name: 키 확인
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID; do
            if ! grep -Eq "^${name}=.+" .env; then
              echo "::error::시크릿 ENV_FILE 안에 ${name}= 값이 없어요. 내 컴퓨터 .env 내용을 통째로 다시 붙여넣으세요."
              exit 1
            fi
          done
          echo "키 확인 완료 → 진짜 서버로 빌드해요"

      - name: 사용자 앱 빌드
        run: npm run build

      - name: 운영자 사이트 빌드
        run: npm run build:admin

      - name: 사용자 앱 올리기 (app-ururu)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=app-ururu --branch=master --commit-dirty=true

      - name: 운영자 사이트 올리기 (ururu-admin)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-admin --project-name=ururu-admin --branch=master --commit-dirty=true
